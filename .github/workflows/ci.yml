name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: echo "PROJECT_TMP_BASE=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential dpkg-dev debhelper fakeroot perl python3 patch
      - run: make test
      - run: make deb
      - name: Inspect package
        run: find "$RUNNER_TEMP/pve-virtio-mem/build/deb" -name 'pve-virtio-mem_*.deb' -exec dpkg-deb -c {} \;
      - uses: actions/upload-artifact@v5
        with:
          name: pve-virtio-mem-deb
          path: ${{ runner.temp }}/pve-virtio-mem/build/deb/**/pve-virtio-mem_*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Dispose build scratch
        if: always()
        run: make clean CONFIRM_IDLE=yes
