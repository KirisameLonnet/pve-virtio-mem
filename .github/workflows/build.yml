name: Pre-release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: echo "PROJECT_TMP_BASE=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind perl python3 patch
      - run: make test-profile
      - uses: actions/upload-artifact@v5
        with:
          name: profiling-conclusions
          path: docs/profiling/latest.md
      - if: always()
        run: make clean CONFIRM_IDLE=yes
